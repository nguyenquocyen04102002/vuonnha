services:
  db:
    image: postgres:16-alpine
    container_name: vuonnha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vuonnha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuonnha_password}
      POSTGRES_DB: ${POSTGRES_DB:-vuonnha_db}
    ports:
      - "5432:5432"
    volumes:
      - vuonnha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vuonnha} -d ${POSTGRES_DB:-vuonnha_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vuonnha_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vuonnha_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vuonnha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vuonnha_password}
      POSTGRES_DB: ${POSTGRES_DB:-vuonnha_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vuonnha.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_NAME: "Quản trị viên"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - vuonnha_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vuonnha_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - vuonnha_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vuonnha_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vuonnha.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@123}
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - vuonnha_pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    entrypoint: >
      /bin/sh -c "
      cp -f /pgadmin4/pgpass /tmp/pgpass && chmod 600 /tmp/pgpass && export PGPASSFILE=/tmp/pgpass &&
      /entrypoint.sh
      "
    networks:
      - vuonnha_network

networks:
  vuonnha_network:
    driver: bridge

volumes:
  vuonnha_pgdata:
  vuonnha_pgadmin_data:
